{% extends 'base.html' %}
{% block title %}Iniciar sesión · Feria NewMix{% endblock %}
{% block contenido %}
<div class="mx-auto" style="max-width: 440px;">
    <h1 class="section-title mb-3">Iniciar sesión</h1>
    <p class="text-body-secondary">Ingresa con la cuenta asignada por el administrador.</p>
    <form method="post" class="card-newmix p-4">
        {% csrf_token %}
        {% if form.errors %}<div class="alert alert-danger">El usuario o la contraseña no son correctos.</div>{% endif %}
        <div class="mb-3"><label for="id_username" class="form-label">Usuario</label><input id="id_username" class="form-control" type="text" name="username" autocomplete="username" value="{{ form.username.value|default:'' }}" required autofocus></div>
        <div class="mb-3"><label for="id_password" class="form-label">Contraseña</label><input id="id_password" class="form-control" type="password" name="password" autocomplete="current-password" required></div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-newmix">Entrar</button>
    </form>
</div>
{% endblock %}
